# OpenPAVE Exa Skill
# AI-powered web search using Exa.ai neural search

name: exa
version: 1.1.1
description: AI-powered web search using Exa.ai neural search. Search people, companies, news, research papers, GitHub repos, tweets, and more.

author:
  name: cnrai
  url: https://github.com/cnrai

license: MIT
homepage: https://github.com/cnrai/openpave-exa
repository: cnrai/openpave-exa

# Execution pattern
pattern: sandbox
entrypoint: index.js

usage_notes: |
  IMPORTANT FOR AI AGENTS:
  
  Search Strategy:
  - Use `people` for finding specific decision-makers on LinkedIn
  - Use `company` for finding target companies and their profiles
  - Use `search` for general web content and neural/hybrid search
  - Use `news` for time-bound articles and market signals
  - Use `research` for academic papers and technical content
  - Use `answer` when you need a synthesized answer with sources
  
  Best Practices:
  - Be specific in queries — "CTO healthcare startups Hong Kong" > "tech executives"
  - Use --from/--to for time-sensitive research (news, market signals)
  - Use --domains to constrain results to specific sources
  - Use --num to control result count (default is usually 10)
  - Combine `people` + `company` searches for comprehensive prospect research
  - Use `similar` to find competitors or alternatives from a known URL
  
  GTM Research Workflow:
  1. Company search → identify target companies
  2. People search → find decision-makers at those companies
  3. News search → recent signals (funding, expansion, leadership changes)
  4. Answer → synthesize findings into actionable insights
# Sandbox permissions
permissions:
  network:
    - api.exa.ai

# Available commands
commands:
  - name: search
    description: General web search using neural search
    args:
      - <query>
    options:
      - --num <number>
      - --type <type>
      - --domains <domains>
      - --exclude <domains>
      - --from <date>
      - --to <date>
      - --summary

  - name: people
    description: Search for people on LinkedIn
    args:
      - <query>
    options:
      - --num <number>
      - --summary

  - name: company
    description: Search for companies
    args:
      - <query>
    options:
      - --num <number>
      - --summary

  - name: news
    description: Search for news articles
    args:
      - <query>
    options:
      - --num <number>
      - --from <date>
      - --to <date>
      - --summary

  - name: research
    description: Search for research papers
    args:
      - <query>
    options:
      - --num <number>
      - --summary

  - name: github
    description: Search GitHub repositories
    args:
      - <query>
    options:
      - --num <number>
      - --summary

  - name: tweets
    description: Search tweets
    args:
      - <query>
    options:
      - --num <number>
      - --from <date>
      - --to <date>
      - --summary

  - name: similar
    description: Find similar links to a given URL
    args:
      - <url>
    options:
      - --num <number>
      - --summary

  - name: answer
    description: Ask a question and get an AI-generated answer with sources
    args:
      - <question>
    options:
      - --summary

# Token configuration for secure sandbox access
tokens:
  exa:
    type: api_key
    description: Exa.ai API key for neural search
    domains:
      - api.exa.ai
    env:
      required:
        - EXA_API_KEY
    config:
      env: EXA_API_KEY
      type: api_key
      domains:
        - api.exa.ai
      placement:
        type: header
        name: x-api-key
        format: "{token}"

category: search
icon: "\U0001F50D"
# Sandbox permissions
permissions:
  network:
    - api.exa.ai
